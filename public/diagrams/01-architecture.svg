<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="system-ui, -apple-system, sans-serif">
  <!--
    ============================================================
    Architecture wireframe — Agent Skill system topology
    ============================================================
    Theme: monochrome wireframe, stroke=#2A2A32 so the
    consuming component can set color via CSS (text-ink, text-brand)
    Layers top-to-bottom:
      1. External Agents (entry)
      2. Agent Gateway (MCP protocol)
      3. Auth / Rate / Risk
      4. Skills Runtime (info / trade / analytics)
      5. Exchange API Gateway
      6. CoinW Exchange Core
    v0.1 — 2026-04-10 — wireframe, to be styled in Phase 3
  -->

  <style>
    .box { fill: none; stroke: #2A2A32; stroke-width: 1.5; transition: all 0.2s ease; }
    .box-accent { fill: none; stroke: #2A2A32; stroke-width: 2.5; transition: all 0.2s ease; }
    .line { fill: none; stroke: #2A2A32; stroke-width: 1; stroke-linecap: round; }
    .dash { stroke-dasharray: 4 4; }
    .label { fill: #2A2A32; font-size: 13px; font-weight: 500; }
    .label-sm { fill: #2A2A32; font-size: 11px; opacity: 0.7; }
    .label-lg { fill: #2A2A32; font-size: 15px; font-weight: 600; }
    .layer-label { fill: #2A2A32; font-size: 10px; font-weight: 600; letter-spacing: 0.1em; opacity: 0.5; text-transform: uppercase; }
    g:hover > .box { stroke: #5227FF; stroke-width: 2; fill: rgba(82,39,255,0.04); }
    g:hover > .box-accent { stroke: #5227FF; stroke-width: 3; fill: rgba(82,39,255,0.06); }
    g:hover .label, g:hover .label-lg { fill: #5227FF; }
    @keyframes flowDown { 0% { stroke-dashoffset: 16; } 100% { stroke-dashoffset: 0; } }
    .line:not(.dash) { stroke-dasharray: 8 8; stroke-dashoffset: 16; animation: flowDown 1.2s linear infinite; }
  </style>

  <!-- Layer 1: External Agents -->
  <text x="20" y="30" class="layer-label">1 · ENTRY</text>
  <g transform="translate(80,45)">
    <rect class="box" x="0" y="0" width="140" height="50" rx="8"/>
    <text x="70" y="22" text-anchor="middle" class="label">Claude / ChatGPT</text>
    <text x="70" y="38" text-anchor="middle" class="label-sm">自主发现接入</text>
  </g>
  <g transform="translate(240,45)">
    <rect class="box" x="0" y="0" width="140" height="50" rx="8"/>
    <text x="70" y="22" text-anchor="middle" class="label">Custom Agents</text>
    <text x="70" y="38" text-anchor="middle" class="label-sm">用户自建 Agent</text>
  </g>
  <g transform="translate(400,45)">
    <rect class="box" x="0" y="0" width="140" height="50" rx="8"/>
    <text x="70" y="22" text-anchor="middle" class="label">TG Bot / Email</text>
    <text x="70" y="38" text-anchor="middle" class="label-sm">低门槛通道 (P6)</text>
  </g>
  <g transform="translate(560,45)">
    <rect class="box" x="0" y="0" width="140" height="50" rx="8"/>
    <text x="70" y="22" text-anchor="middle" class="label">CoinW Web/App</text>
    <text x="70" y="38" text-anchor="middle" class="label-sm">站内落地页 (M17)</text>
  </g>
  <g transform="translate(720,45)">
    <rect class="box dash" x="0" y="0" width="140" height="50" rx="8"/>
    <text x="70" y="22" text-anchor="middle" class="label">3rd-party (future)</text>
    <text x="70" y="38" text-anchor="middle" class="label-sm">F4 开发者 Skills</text>
  </g>

  <!-- Layer 2: Gateway -->
  <text x="20" y="140" class="layer-label">2 · GATEWAY</text>
  <g transform="translate(80,155)">
    <rect class="box-accent" x="0" y="0" width="780" height="60" rx="10"/>
    <text x="390" y="25" text-anchor="middle" class="label-lg">Agent Gateway — MCP Server (M15)</text>
    <text x="390" y="45" text-anchor="middle" class="label-sm">协议路由 · 会话管理 · Skills 发现 (M16) · 调用统计 (M18)</text>
  </g>

  <!-- Connectors L1 -> L2 -->
  <line class="line" x1="150" y1="95" x2="220" y2="155"/>
  <line class="line" x1="310" y1="95" x2="320" y2="155"/>
  <line class="line" x1="470" y1="95" x2="430" y2="155"/>
  <line class="line" x1="630" y1="95" x2="540" y2="155"/>
  <line class="line dash" x1="790" y1="95" x2="680" y2="155"/>

  <!-- Layer 3: Auth / Rate / Risk (parallel bar) -->
  <text x="20" y="250" class="layer-label">3 · SECURITY</text>
  <g transform="translate(80,265)">
    <rect class="box" x="0" y="0" width="250" height="55" rx="8"/>
    <text x="125" y="23" text-anchor="middle" class="label">API Key Auth (M11)</text>
    <text x="125" y="40" text-anchor="middle" class="label-sm">权限分级 M12 · 白名单 P8</text>
  </g>
  <g transform="translate(355,265)">
    <rect class="box" x="0" y="0" width="250" height="55" rx="8"/>
    <text x="125" y="23" text-anchor="middle" class="label">Rate Limit (M13)</text>
    <text x="125" y="40" text-anchor="middle" class="label-sm">调用异常告警 P9</text>
  </g>
  <g transform="translate(630,265)">
    <rect class="box" x="0" y="0" width="230" height="55" rx="8"/>
    <text x="115" y="23" text-anchor="middle" class="label">Risk Control (M14)</text>
    <text x="115" y="40" text-anchor="middle" class="label-sm">大额二次确认 P5 · 禁提现 M10</text>
  </g>

  <!-- Connectors L2 -> L3 -->
  <line class="line" x1="470" y1="215" x2="470" y2="265"/>

  <!-- Layer 4: Skills Runtime -->
  <text x="20" y="360" class="layer-label">4 · SKILLS RUNTIME</text>
  <g transform="translate(80,375)">
    <rect class="box" x="0" y="0" width="170" height="100" rx="8"/>
    <text x="85" y="22" text-anchor="middle" class="label-lg">Info Skills</text>
    <text x="85" y="42" text-anchor="middle" class="label-sm">M1 行情 / M2 涨跌排行</text>
    <text x="85" y="58" text-anchor="middle" class="label-sm">M3 公告 / M4 多语言</text>
    <text x="85" y="78" text-anchor="middle" class="label-sm">P1 概览 · P2 链上 · P3 资讯</text>
  </g>
  <g transform="translate(275,375)">
    <rect class="box" x="0" y="0" width="170" height="100" rx="8"/>
    <text x="85" y="22" text-anchor="middle" class="label-lg">Trade Skills</text>
    <text x="85" y="42" text-anchor="middle" class="label-sm">M5 下单 / M6 订单查询</text>
    <text x="85" y="58" text-anchor="middle" class="label-sm">M7 余额 / M8 持仓</text>
    <text x="85" y="78" text-anchor="middle" class="label-sm">M9 划转 · M10 禁提现</text>
  </g>
  <g transform="translate(470,375)">
    <rect class="box" x="0" y="0" width="170" height="100" rx="8"/>
    <text x="85" y="22" text-anchor="middle" class="label-lg">Analytics</text>
    <text x="85" y="42" text-anchor="middle" class="label-sm">P4 结构化报告</text>
    <text x="85" y="58" text-anchor="middle" class="label-sm">P7 转化漏斗</text>
    <text x="85" y="78" text-anchor="middle" class="label-sm">M18 调用统计</text>
  </g>
  <g transform="translate(665,375)">
    <rect class="box dash" x="0" y="0" width="195" height="100" rx="8"/>
    <text x="97" y="22" text-anchor="middle" class="label-lg">Future (F1-F6)</text>
    <text x="97" y="42" text-anchor="middle" class="label-sm">F1 交易回顾</text>
    <text x="97" y="58" text-anchor="middle" class="label-sm">F3 策略跟单</text>
    <text x="97" y="78" text-anchor="middle" class="label-sm">F4 3rd Skills · F5 付费</text>
  </g>

  <!-- Connectors L3 -> L4 -->
  <line class="line" x1="205" y1="320" x2="165" y2="375"/>
  <line class="line" x1="360" y1="320" x2="360" y2="375"/>
  <line class="line" x1="555" y1="320" x2="555" y2="375"/>
  <line class="line dash" x1="745" y1="320" x2="762" y2="375"/>

  <!-- Layer 5: Exchange API Gateway -->
  <text x="20" y="510" class="layer-label">5 · EXCHANGE API</text>
  <g transform="translate(80,520)">
    <rect class="box-accent" x="0" y="0" width="780" height="55" rx="10"/>
    <text x="390" y="23" text-anchor="middle" class="label-lg">CoinW Exchange API Gateway</text>
    <text x="390" y="43" text-anchor="middle" class="label-sm">Spot · Futures · Options · Wallet · Announcement · DeriW Perp (延展)</text>
  </g>

  <!-- Connectors L4 -> L5 -->
  <line class="line" x1="165" y1="475" x2="200" y2="520"/>
  <line class="line" x1="360" y1="475" x2="380" y2="520"/>
  <line class="line" x1="555" y1="475" x2="560" y2="520"/>
  <line class="line dash" x1="762" y1="475" x2="740" y2="520"/>

  <!-- Side note: data flow arrow -->
  <g transform="translate(895,155)">
    <line class="line" x1="0" y1="0" x2="0" y2="375"/>
    <polygon fill="#2A2A32" points="-5,375 0,385 5,375"/>
    <text x="-8" y="150" class="label-sm" writing-mode="tb" text-anchor="middle">Request flow</text>
  </g>
</svg>
