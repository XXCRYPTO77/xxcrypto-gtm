<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="system-ui, -apple-system, sans-serif">
  <!--
    ============================================================
    Merge-back wireframe — standalone MCP → main site integration
    ============================================================
    3-step migration: Standalone → Shadow Mode → Native Integration
    Left: current state (independent MCP server on xxcrypto)
    Middle: shadow mode (dual-write, main site reads from both)
    Right: native (MCP server absorbed into CoinW main site)
    v0.1 — 2026-04-10
  -->

  <style>
    .box { fill: none; stroke: #2A2A32; stroke-width: 1.5; transition: all 0.2s ease; }
    .box-accent { fill: none; stroke: #2A2A32; stroke-width: 2.5; transition: all 0.2s ease; }
    .box-ghost { fill: none; stroke: #2A2A32; stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.6; transition: all 0.2s ease; }
    .container { fill: #2A2A32; opacity: 0.04; stroke: #2A2A32; stroke-width: 1.2; transition: all 0.2s ease; }
    .line { fill: none; stroke: #2A2A32; stroke-width: 1.2; stroke-linecap: round; }
    .line-hot { fill: none; stroke: #2A2A32; stroke-width: 2; }
    .dash { stroke-dasharray: 4 3; }
    .arrow { fill: #2A2A32; }
    .label-xl { fill: #2A2A32; font-size: 17px; font-weight: 700; }
    .label-lg { fill: #2A2A32; font-size: 14px; font-weight: 600; }
    .label { fill: #2A2A32; font-size: 12px; }
    .label-sm { fill: #2A2A32; font-size: 10px; opacity: 0.75; }
    .step-num { fill: #2A2A32; font-size: 42px; font-weight: 700; opacity: 0.12; }
    g:hover > .box { stroke: #5227FF; stroke-width: 2; fill: rgba(82,39,255,0.04); }
    g:hover > .box-accent { stroke: #5227FF; stroke-width: 3; fill: rgba(82,39,255,0.06); }
    g:hover > .box-ghost { stroke: #5227FF; opacity: 0.8; }
    g:hover > .container { fill: #5227FF; opacity: 0.06; stroke: #5227FF; }
    g:hover .label, g:hover .label-lg { fill: #5227FF; }
    @keyframes flowRight { 0% { stroke-dashoffset: 14; } 100% { stroke-dashoffset: 0; } }
    .line-hot { stroke-dasharray: 7 7; animation: flowRight 1s linear infinite; }
  </style>

  <!-- Title -->
  <text x="480" y="30" text-anchor="middle" class="label-xl">Merge-back Path · 从独立 MCP 到主站原生集成</text>
  <text x="480" y="50" text-anchor="middle" class="label-sm">三步 migration · 每步保证业务不间断 · 用户无感知</text>

  <!-- ============= Step 1: Standalone ============= -->
  <g transform="translate(20,80)">
    <text x="0" y="50" class="step-num">01</text>
    <rect class="container" x="0" y="80" width="290" height="380" rx="8"/>
    <text x="145" y="105" text-anchor="middle" class="label-lg">Standalone</text>
    <text x="145" y="122" text-anchor="middle" class="label-sm">当前状态 · 独立运行</text>

    <!-- User -->
    <rect class="box" x="95" y="140" width="100" height="36" rx="6"/>
    <text x="145" y="163" text-anchor="middle" class="label">用户 / Agent</text>

    <!-- Standalone MCP -->
    <rect class="box-accent" x="40" y="210" width="210" height="80" rx="6"/>
    <text x="145" y="234" text-anchor="middle" class="label-lg">XXCrypto MCP</text>
    <text x="145" y="252" text-anchor="middle" class="label-sm">独立部署 · Vercel</text>
    <text x="145" y="268" text-anchor="middle" class="label-sm">自建 API Gateway</text>
    <text x="145" y="284" text-anchor="middle" class="label-sm">自建认证</text>

    <!-- Exchange API -->
    <rect class="box" x="40" y="330" width="210" height="60" rx="6"/>
    <text x="145" y="354" text-anchor="middle" class="label">CoinW Exchange API</text>
    <text x="145" y="372" text-anchor="middle" class="label-sm">外部调用方身份</text>

    <!-- Main site (ghost, shows no direct link) -->
    <rect class="box-ghost" x="40" y="410" width="210" height="36" rx="6"/>
    <text x="145" y="432" text-anchor="middle" class="label-sm">CoinW 主站 (尚未集成)</text>

    <!-- Arrows -->
    <line class="line" x1="145" y1="176" x2="145" y2="210"/>
    <polygon class="arrow" points="140,205 145,215 150,205"/>
    <line class="line" x1="145" y1="290" x2="145" y2="330"/>
    <polygon class="arrow" points="140,325 145,335 150,325"/>
  </g>

  <!-- ============= Step 2: Shadow ============= -->
  <g transform="translate(335,80)">
    <text x="0" y="50" class="step-num">02</text>
    <rect class="container" x="0" y="80" width="290" height="380" rx="8"/>
    <text x="145" y="105" text-anchor="middle" class="label-lg">Shadow Mode</text>
    <text x="145" y="122" text-anchor="middle" class="label-sm">过渡 · 双写验证</text>

    <!-- User -->
    <rect class="box" x="95" y="140" width="100" height="36" rx="6"/>
    <text x="145" y="163" text-anchor="middle" class="label">用户 / Agent</text>

    <!-- Splitter -->
    <polygon class="box" points="145,200 125,220 165,220"/>
    <text x="175" y="217" class="label-sm">流量分流</text>

    <!-- Old MCP -->
    <rect class="box" x="10" y="240" width="125" height="70" rx="6"/>
    <text x="72" y="262" text-anchor="middle" class="label">XXCrypto MCP</text>
    <text x="72" y="278" text-anchor="middle" class="label-sm">主路径</text>
    <text x="72" y="294" text-anchor="middle" class="label-sm">90% 流量</text>

    <!-- New MCP on main site -->
    <rect class="box-accent" x="155" y="240" width="125" height="70" rx="6"/>
    <text x="217" y="262" text-anchor="middle" class="label">主站 MCP</text>
    <text x="217" y="278" text-anchor="middle" class="label-sm">影子路径</text>
    <text x="217" y="294" text-anchor="middle" class="label-sm">10% 流量</text>

    <!-- Diff detector -->
    <rect class="box dash" x="55" y="330" width="180" height="40" rx="6"/>
    <text x="145" y="353" text-anchor="middle" class="label">Diff Detector · 对比一致性</text>

    <!-- Exchange API -->
    <rect class="box" x="40" y="400" width="210" height="46" rx="6"/>
    <text x="145" y="428" text-anchor="middle" class="label">CoinW Exchange API</text>

    <!-- Arrows -->
    <line class="line" x1="145" y1="176" x2="145" y2="200"/>
    <polygon class="arrow" points="140,196 145,204 150,196"/>
    <line class="line-hot" x1="125" y1="220" x2="72" y2="240"/>
    <line class="line dash" x1="165" y1="220" x2="217" y2="240"/>
    <line class="line" x1="72"  y1="310" x2="115" y2="330"/>
    <line class="line" x1="217" y1="310" x2="175" y2="330"/>
    <line class="line" x1="145" y1="370" x2="145" y2="400"/>
    <polygon class="arrow" points="140,395 145,405 150,395"/>
  </g>

  <!-- ============= Step 3: Native ============= -->
  <g transform="translate(650,80)">
    <text x="0" y="50" class="step-num">03</text>
    <rect class="container" x="0" y="80" width="290" height="380" rx="8"/>
    <text x="145" y="105" text-anchor="middle" class="label-lg">Native</text>
    <text x="145" y="122" text-anchor="middle" class="label-sm">终态 · 主站原生功能</text>

    <!-- User -->
    <rect class="box" x="95" y="140" width="100" height="36" rx="6"/>
    <text x="145" y="163" text-anchor="middle" class="label">用户 / Agent</text>

    <!-- Main site with embedded MCP -->
    <rect class="box-accent" x="20" y="210" width="250" height="160" rx="8"/>
    <text x="145" y="235" text-anchor="middle" class="label-lg">CoinW Main Site</text>
    <text x="145" y="254" text-anchor="middle" class="label-sm">———— 内含 ————</text>

    <rect class="box" x="40" y="270" width="210" height="40" rx="6"/>
    <text x="145" y="295" text-anchor="middle" class="label">MCP Server (原生)</text>

    <rect class="box" x="40" y="318" width="210" height="40" rx="6"/>
    <text x="145" y="343" text-anchor="middle" class="label">统一认证 · 统一风控</text>

    <!-- Old MCP now archived -->
    <rect class="box-ghost" x="40" y="395" width="210" height="40" rx="6"/>
    <text x="145" y="420" text-anchor="middle" class="label-sm">XXCrypto MCP (已废弃)</text>

    <!-- Arrow -->
    <line class="line-hot" x1="145" y1="176" x2="145" y2="210"/>
    <polygon class="arrow" points="140,205 145,215 150,205"/>
  </g>

  <!-- Transition arrows between steps -->
  <g transform="translate(0,0)">
    <line class="line-hot" x1="310" y1="270" x2="335" y2="270"/>
    <polygon class="arrow" points="330,265 340,270 330,275"/>
    <line class="line-hot" x1="625" y1="270" x2="650" y2="270"/>
    <polygon class="arrow" points="645,265 655,270 645,275"/>
  </g>

  <!-- Bottom timeline -->
  <g transform="translate(20,490)">
    <line class="line" x1="0" y1="10" x2="920" y2="10"/>
    <circle cx="145" cy="10" r="4" fill="#2A2A32"/>
    <circle cx="460" cy="10" r="4" fill="#2A2A32"/>
    <circle cx="775" cy="10" r="4" fill="#2A2A32"/>
    <text x="145" y="32" text-anchor="middle" class="label-sm">v1.5 完成时 · 启动集成</text>
    <text x="460" y="32" text-anchor="middle" class="label-sm">v1.8-1.9 · Shadow 2 周</text>
    <text x="775" y="32" text-anchor="middle" class="label-sm">v2.0 · 正式集成</text>
  </g>
</svg>
